name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows build, tests, smoke, audit
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Winsight.slnx

      - name: Build
        run: dotnet build Winsight.slnx -c Release --no-restore

      - name: Core tests
        run: dotnet test tests\Winsight.Core.Tests -c Release --no-build --logger "trx" --results-directory TestResults\Core

      - name: MCP tests
        run: dotnet test tests\Winsight.Mcp.Tests -c Release --no-build --logger "trx" --results-directory TestResults\Mcp

      - name: E2E tests
        run: dotnet test tests\Winsight.E2E -c Release --no-build --logger "trx" --results-directory TestResults\E2E

      - name: MCP smoke
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\smoke-mcp.ps1 -ExpectedToolCount 71

      - name: Verified control regression scenarios
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          & .\tools\Winsight.Eval\bin\Release\net10.0-windows10.0.19041.0\Winsight.Eval.exe .\samples\SampleWpfApp\bin\Release\net10.0-windows\SampleWpfApp.exe scripted .\TestResults\verified-control.jsonl
          exit $LASTEXITCODE

      - name: Build Windows installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-setup.ps1

      - name: Upload installer
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: winsight-windows-setup
          retention-days: 7
          path: |
            artifacts/setup/*.exe
            artifacts/setup/*.zip
            artifacts/setup/SHA256SUMS.txt

      - name: NuGet vulnerability audit
        run: dotnet list Winsight.slnx package --vulnerable --include-transitive

      - name: NuGet deprecated package audit
        run: dotnet list Winsight.slnx package --deprecated

      - name: NuGet outdated package audit
        run: dotnet list Winsight.slnx package --outdated

      - name: Upload test results and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: winsight-test-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            TestResults/**
            ${{ runner.temp }}\winsight/**
            ${{ runner.temp }}\winsight-tests/**
