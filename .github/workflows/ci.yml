name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows build, tests, smoke, audit
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Winsight.slnx

      - name: Build
        run: dotnet build Winsight.slnx -c Release --no-restore

      - name: Core tests
        run: dotnet test tests\Winsight.Core.Tests -c Release --no-build

      - name: MCP tests
        run: dotnet test tests\Winsight.Mcp.Tests -c Release --no-build

      - name: E2E tests
        run: dotnet test tests\Winsight.E2E -c Release --no-build

      - name: MCP smoke
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\smoke-mcp.ps1 -ExpectedToolCount 40

      - name: NuGet vulnerability audit
        run: dotnet list Winsight.slnx package --vulnerable --include-transitive

      - name: NuGet deprecated package audit
        run: dotnet list Winsight.slnx package --deprecated

      - name: NuGet outdated package audit
        run: dotnet list Winsight.slnx package --outdated
